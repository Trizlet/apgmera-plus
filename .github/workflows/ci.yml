name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qy
          sudo apt-get install -y build-essential pkg-config libcurl4-openssl-dev python3 python3-numpy

      - name: Stdin Census Verification Test
        run: |
          bash recompile.sh --symmetry 'gitlab_stdin_test'
          cat test/minstrels.rle | ./apgluxe -L 1 -t 1 -s 'test_seed'
          cat *.test_seed.txt | tr ' ' '\n' | grep xq6 | sort | uniq > sortedships.txt
          sha256sum sortedships.txt | grep b0a11c658

      - name: Build Standard Life (b3s23 / C1)
        run: |
          bash recompile.sh
          ./apgluxe --help
